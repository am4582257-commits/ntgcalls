name: Build Termux arm64 ntgcalls
on:
  workflow_dispatch:
  push:
    branches:
      - termux-runtime-fix
    paths:
      - '.github/workflows/termux-build.yml'
      - 'CMakeLists.txt'
      - 'setup.py'
      - 'targets/termux/**'
      - 'wrtc/**'
      - 'ntgcalls/**'
      - 'cmake/**'
      - 'deps/**'
      - 'version.properties'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install --upgrade setuptools ninja
      - name: Build Termux arm64 native library
        run: python setup.py build_lib --target=termux
      - name: Package native library and C++ runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package
          cp targets/termux/lib/arm64-v8a/libntgcalls.a package/
          NDK_DIR="$PWD/deps/ndk/src"
          CXX_RUNTIME="$(find "$NDK_DIR/toolchains/llvm/prebuilt" -path '*/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so' -print -quit)"
          test -n "$CXX_RUNTIME"
          cp "$CXX_RUNTIME" package/
          {
            echo "source_commit=$GITHUB_SHA"
            echo "source_branch=$GITHUB_REF_NAME"
            echo "android_abi=arm64-v8a"
            echo "termux_runtime=enabled"
            echo "ndk= r30"
            echo "library=libntgcalls.a"
          } > package/BUILD-INFO.txt
          sha256sum package/* > package/SHA256SUMS.txt
          tar -czf ntgcalls-termux-arm64.tar.gz -C package .
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ntgcalls-termux-arm64
          path: ntgcalls-termux-arm64.tar.gz
          if-no-files-found: error
          retention-days: 14
