[options]
workdir = {builddir}
platforms = android

[build]
configure =
    {cmake} {root} -DCMAKE_BUILD_TYPE={config} -DSTATIC_BUILD={static} -DBINDING=termux -DANDROID_ABI={arch} -DTERMUX_RUNTIME=ON -DUSE_LIBCXX=OFF -DCMAKE_TOOLCHAIN_FILE={toolchain}
build =
    {cmake} --build . --target clean_objects
    {cmake} --build . --config {config} -j{jobs}
